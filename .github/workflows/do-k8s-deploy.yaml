name: Deploy Bitcoinnailbar to DO Kubernetes

on:
  push:
    branches: [dev, staging, master, devops/implement-cicd-pipeline]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & push Docker image to DOCR
    outputs:
      image: ${{ steps.meta.outputs.image }}
      deploy_env: ${{ steps.env.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        run: |
          DOCTL_VERSION="1.104.0"
          ARCH=$(uname -m)
          [ "$ARCH" = "x86_64" ] && ARCH="amd64" || true
          if [ "$(uname -s)" = "Darwin" ]; then
            PLATFORM="darwin-$ARCH"
          else
            PLATFORM="linux-$ARCH"
          fi
          curl -sL "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/doctl-${DOCTL_VERSION}-${PLATFORM}.tar.gz" | tar xz
          sudo mv doctl /usr/local/bin/
          doctl version

      - name: Resolve deployment environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="${{ github.ref_name }}"
          fi

          if [ "$ENV" = "devops/implement-cicd-pipeline" ]; then
            ENV="dev"
          fi

          case "$ENV" in
            dev)
              echo "deploy_env=dev" >> "$GITHUB_OUTPUT"
              echo "build_env=test" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "deploy_env=staging" >> "$GITHUB_OUTPUT"
              echo "build_env=staging" >> "$GITHUB_OUTPUT"
              ;;
            master|prod)
              echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
              echo "build_env=production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown environment: $ENV"
              exit 1
              ;;
          esac

      - name: Authenticate to DigitalOcean
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          doctl auth init -t "$DIGITALOCEAN_ACCESS_TOKEN"

      - name: Login to DO Container Registry
        run: |
          doctl registry login

      - name: Build and push image
        id: meta
        env:
          BUILD_ENV: ${{ steps.env.outputs.build_env }}
        run: |
          REGISTRY="${{ vars.DO_REGISTRY_NAME }}"
          REPO="${{ vars.DOCR_REPOSITORY }}"
          [ -z "$REPO" ] && REPO="bitcoinnailbarcom"

          if [ -z "$REGISTRY" ]; then
            echo "Missing vars.DO_REGISTRY_NAME (DigitalOcean registry name)."
            exit 1
          fi

          case "$BUILD_ENV" in
            test) NPM_SCRIPT="build" ;;
            staging) NPM_SCRIPT="build:staging" ;;
            production) NPM_SCRIPT="build:production" ;;
            *) NPM_SCRIPT="build" ;;
          esac

          TAG="${{ steps.env.outputs.deploy_env }}-${{ github.sha }}"
          IMAGE="registry.digitalocean.com/${REGISTRY}/${REPO}:${TAG}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building image with npm script: $NPM_SCRIPT"

          docker build \
            --build-arg NPM_SCRIPT="$NPM_SCRIPT" \
            -t "$IMAGE" \
            .
          docker push "$IMAGE"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    name: Update ArgoCD manifests
    steps:
      - name: Checkout ArgoCD repository
        uses: actions/checkout@v4
        with:
          repository: vlink-group/devops
          token: ${{ secrets.GH_PAT }}
          path: devops
          ref: argocd

      - name: Update deployment manifest image tag
        run: |
          ENV="${{ needs.build-and-push.outputs.deploy_env }}"

          case "$ENV" in
            dev) ENV_DIR="dev" ;;
            staging) ENV_DIR="staging" ;;
            prod) ENV_DIR="master" ;;
            *)
              echo "Unknown deploy_env: $ENV"
              exit 1
              ;;
          esac

          REPO="${{ vars.DOCR_REPOSITORY }}"
          [ -z "$REPO" ] && REPO="bitcoinnailbarcom"

          FILE="devops/argocd/${ENV_DIR}/${REPO}/deployment.yaml"
          echo "Updating image tag in $FILE for environment: $ENV"

          sed -i "s|:${ENV}-.*|:${ENV}-${GITHUB_SHA}|g" "$FILE"

      - name: Commit and push changes to ArgoCD repository
        run: |
          cd devops
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update bitcoinnailbarcom image to ${GITHUB_SHA}"
          git push
